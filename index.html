<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JD Peñaherrera</title>
<link rel="icon" type="image/jpeg" href="/JD_PFP.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink-900:#00172E; --ink-700:#002B57;
  --blue-600:#0E72DA; --blue-500:#0D84FF; --blue-300:#B2D5FF;
  --blue-100:#F0F7FF; --blue-050:#EFF9FE;
  --slate-600:#597597; --slate-500:#798594;
  --paper:#FAFDFF; --surface-100:#F2F3F9;
  --text-primary:var(--ink-900);
  --text-secondary:var(--ink-700);
  --text-muted:var(--slate-600);
  --text-caption:var(--slate-500);
  --text-accent:var(--blue-500);
  --border-subtle:rgba(0,23,46,0.10);
  --border-strong:rgba(0,23,46,0.22);
  --rule:rgba(0,23,46,0.14);
  --font-serif:'Newsreader',Georgia,serif;
  --font-sans:'Public Sans','Helvetica Neue',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --weight-medium:500; --weight-semibold:600;
  --tracking-display:-0.03em; --tracking-eyebrow:0.06em;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --dur-fast:140ms; --dur-base:240ms;
}
html,body{height:100%;}
body{
  font-family:var(--font-sans);
  background:var(--paper);
  color:var(--text-primary);
  min-height:100vh;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* NAV */
nav{
  border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4rem;height:56px;flex-shrink:0;
  background:var(--paper);
  position:sticky;top:0;z-index:10;
}
.nav-logo{
  font-family:var(--font-serif);font-size:19px;font-weight:var(--weight-medium);
  letter-spacing:-0.02em;color:var(--text-primary);text-decoration:none;
}
.nav-logo em{font-style:italic;}
.nav-links{display:flex;gap:3rem;align-items:center;}
.nav-link{
  font-family:var(--font-sans);font-size:12px;font-weight:var(--weight-semibold);
  letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;
  color:var(--text-muted);text-decoration:none;
  transition:color var(--dur-fast) var(--ease-out);
}
.nav-link:hover{color:var(--text-primary);}
.nav-link.active{color:var(--text-primary);}

/* MAIN */
main{flex:1;display:flex;align-items:center;padding:4rem 4rem;}
.inner{max-width:800px;margin:0 auto;width:100%;}
.grid{display:grid;grid-template-columns:200px 1fr;gap:5rem;align-items:center;}

/* PHOTO */
.nft{
  width:200px;height:200px;
  display:block;flex-shrink:0;object-fit:cover;
}

/* TEXT */
.eyebrow{
  font-family:var(--font-sans);font-size:12px;font-weight:var(--weight-semibold);
  letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;
  color:var(--text-accent);margin-bottom:1.25rem;
}
.name{
  font-family:var(--font-serif);font-size:3rem;font-weight:var(--weight-medium);
  line-height:1.04;letter-spacing:var(--tracking-display);margin-bottom:.75rem;
}
.name em{font-style:italic;}
.tagline{
  font-family:var(--font-serif);font-style:italic;
  font-size:1.05rem;color:var(--text-secondary);
  margin-bottom:2.5rem;line-height:1.6;
}

/* SECTION LINKS */
.sections{
  display:flex;gap:2rem;
  border-top:1px solid var(--border-subtle);
  padding-top:1.25rem;flex-wrap:wrap;
}
.sec{
  font-family:var(--font-sans);font-size:12px;font-weight:var(--weight-semibold);
  letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;
  color:var(--text-muted);text-decoration:none;
  transition:color var(--dur-fast) var(--ease-out);
}
.sec:hover{color:var(--text-primary);}

/* FOOTER */
footer{
  border-top:1px solid var(--border-subtle);
  padding:1.25rem 4rem;
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;
}
.footer-copy{
  font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;
  color:var(--text-caption);
}
.footer-link{
  font-family:var(--font-sans);font-size:12px;font-weight:var(--weight-semibold);
  letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;
  color:var(--text-muted);text-decoration:none;
  transition:color var(--dur-fast) var(--ease-out);
}
.footer-link:hover{color:var(--text-primary);}

/* RESPONSIVE */
@media(max-width:768px){
  nav{padding:0 1.5rem;}
  .nav-links{gap:1.5rem;}
  main{padding:3rem 1.5rem;align-items:flex-start;}
  .grid{grid-template-columns:1fr;gap:2rem;text-align:center;}
  .nft{width:140px;height:140px;margin:0 auto;}
  .name{font-size:2.4rem;}
  .sections{justify-content:center;}
  footer{padding:1rem 1.5rem;flex-direction:column;gap:.5rem;text-align:center;}
}
@media(max-width:400px){
  nav{padding:0 1.25rem;}
  main{padding:2.5rem 1.25rem;}
  .name{font-size:2rem;}
  .sections{gap:1.25rem;}
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/"><em>JD</em></a>
  <div class="nav-links">
    <a class="nav-link" href="/experience">Experience</a>
    <a class="nav-link" href="/blog">Writing</a>
  </div>
</nav>

<main>
  <div class="inner">
    <div class="grid">
      <img class="nft" src="JD_PFP.jpeg" alt="JD Peñaherrera">
      <div>
        <div class="eyebrow">JD Peñaherrera</div>
        <h1 class="name">Operator.<br><em>Builder.</em></h1>
        <p class="tagline">Operator with a track record of scaling<br>businesses across Latin America.</p>
        <div class="sections">
          <a class="sec" href="/experience">Experience</a>
          <a class="sec" href="/blog">Writing</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <span class="footer-copy">juandiego.work</span>
  <span class="footer-copy">© 2026 JD Peñaherrera</span>
</footer>

</body>
</html>
